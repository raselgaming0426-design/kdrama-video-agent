<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Drama AI Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #0001;
    }
    h1 { color: #6d28d9; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #6d28d9;
      color: white;
      border: none;
      font-size: 16px;
      margin-top: 20px;
    }
    .note { color: #555; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>K-Drama AI Agent</h1>
    <p>Drama video ও Bangla voice বেছে নাও।</p>

    <label for="video">1. Drama Video</label>
    <input id="video" type="file" accept="video/*">

    <label for="voice">2. Bangla Voice (MP3/WAV)</label>
    <input id="voice" type="file" accept="audio/mpeg,audio/wav,audio/*">

    <label for="duration">Target Video Duration</label>
    <select id="duration">
      <option value="12">12 minutes</option>
      <option value="13" selected>13 minutes</option>
      <option value="15">15 minutes</option>
    </select>

    <label for="instructions">Extra Instructions (optional)</label>
    <input id="instructions" type="text" placeholder="যেমন: শুধু main story রাখবে">

    <button type="button" onclick="checkFiles()">Check Selected Files</button>
    <p id="status" class="note">এখনো কোনো ফাইল নির্বাচন করা হয়নি।</p>
    <p class="note">নোট: আপাতত ফাইল বেছে নেওয়া ও যাচাই করার ডেমো। এখনো ভিডিও এডিট বা MP4 export করে না।</p>
  </div>

<script>
async function checkFiles() {
  const video = document.getElementById('video').files[0];
  const voice = document.getElementById('voice').files[0];
  const status = document.getElementById('status');

  if (!video || !voice) {
    status.textContent =
      'দয়া করে ভিডিও এবং বাংলা ভয়েস—দুটিই নির্বাচন করো।';
    return;
  }

  if (video.size > 100 * 1024 * 1024 ||
      voice.size > 100 * 1024 * 1024) {
    status.textContent =
      'পরীক্ষার জন্য ১০০ MB-এর কম ফাইল ব্যবহার করো।';
    return;
  }

  const formData = new FormData();
  formData.append('video', video);
  formData.append('voice', voice);

  status.textContent = 'সার্ভারের সঙ্গে সংযোগ হচ্ছে...';

  try {
    const response = await fetch(
      'https://kdrama-video-agent.onrender.com/upload',
      {
        method: 'POST',
        body: formData
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || 'আপলোড সফল হয়নি।');
    }

    status.textContent =
      'ফাইল আপলোড সফল হয়েছে! ভিডিও এডিটিং ফিচার এখনো তৈরি করা বাকি।';

  } catch (error) {
    status.textContent =
      'আপলোড ব্যর্থ হয়েছে: ' + error.message;
  }
}
</script>
</body>
</html>
